name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Release tags must use vMAJOR.MINOR.PATCH, for example v0.1.20.'
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Set version from tag
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./mvnw -B -ntp versions:set "-DnewVersion=$RELEASE_VERSION" -DgenerateBackupPoms=false

      - name: Build and test application
        run: ./mvnw -B -ntp clean verify -Dquarkus.container-image.build=false

      - name: Upload application for Docker build
        uses: actions/upload-artifact@v5
        with:
          name: quarkus-app
          path: target/quarkus-app
          if-no-files-found: error

      - name: Build fat JAR
        run: ./mvnw -B -ntp package -DskipTests -Dquarkus.container-image.build=false -Dquarkus.package.jar.type=uber-jar

      - name: Prepare release assets
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd target
          cp "slogan-generator-${RELEASE_VERSION}-runner.jar" "slogan-generator-${RELEASE_VERSION}.jar"
          sha256sum "slogan-generator-${RELEASE_VERSION}.jar" > SHA256SUMS

      - name: Upload release assets
        uses: actions/upload-artifact@v5
        with:
          name: release-assets
          path: |
            target/slogan-generator-${{ steps.version.outputs.version }}.jar
            target/SHA256SUMS
          if-no-files-found: error

  docker:
    needs: build
    uses: ./.github/workflows/docker.yml
    with:
      image-tags: |
        greystone/slogan-generator:${{ needs.build.outputs.version }}
        greystone/slogan-generator:latest
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  release:
    needs: [build, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v5
        with:
          name: release-assets
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
          body: |
            Run the fat JAR with JDK 25 or newer:

            ```sh
            java -jar slogan-generator-${{ needs.build.outputs.version }}.jar
            ```

            Docker Hub images support Linux AMD64 and ARM64:

            ```sh
            docker run --rm -p 8080:8080 greystone/slogan-generator:${{ needs.build.outputs.version }}
            ```

            Image digest: `${{ needs.docker.outputs.digest }}`
